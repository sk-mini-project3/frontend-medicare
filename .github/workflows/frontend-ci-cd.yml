name: Frontend CI/CD

permissions:
  contents: write
  packages: write
  pull-requests: write

on:
  push:
    branches: [ dev ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push image to ECR
        env:
          ECR_REPOSITORY: ${{ secrets.ECR_FRONTEND_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          REPO_URI="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${ECR_REPOSITORY}"
          docker build -t ${REPO_URI}:${IMAGE_TAG} .
          docker push ${REPO_URI}:${IMAGE_TAG}

      - name: Install PyYAML (for kustomize update)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyyaml

      - name: Update infra kustomization with new frontend image
        env:
          IMAGE_TAG: ${{ github.sha }}
          REPO_URI: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_FRONTEND_REPOSITORY }}
        run: |
          YAML_PATH=medical-service-infra/k8s/overlays/prod/kustomization.yaml
          if [ ! -f "$YAML_PATH" ]; then
            echo "No kustomization found at $YAML_PATH, skipping"
            exit 0
          fi
          python3 - <<'PY'
          import os
          import sys
          import yaml

          path = 'medical-service-infra/k8s/overlays/prod/kustomization.yaml'

          try:
            with open(path, encoding='utf-8') as f:
              doc = yaml.safe_load(f) or {}
          except Exception as e:
            print('could not read kustomization:', e)
            sys.exit(1)

          images = doc.get('images', [])
          tag = os.environ.get('IMAGE_TAG', '')
          repo = os.environ.get('REPO_URI', '')
          updated = False

          for img in images:
            name = img.get('name', '')
            if 'frontend' in name or 'medical-service-frontend' in name:
              if repo:
                img['newName'] = repo
              if tag:
                img['newTag'] = tag
              updated = True

          if updated:
            with open(path, 'w', encoding='utf-8') as f:
              yaml.safe_dump(doc, f, sort_keys=False)
            print('kustomization updated')
          else:
            print('no matching frontend image entry, nothing to do')
          PY

      - name: Create PR to update kustomization
        uses: peter-evans/create-pull-request@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "ci: bump frontend image to ${{ github.sha }} [skip ci]"
          title: "ci: bump frontend image to ${{ github.sha }}"
          body: |
            Automatic kustomization update for frontend image.
          base: main
          branch: ci/update-frontend-${{ github.sha }}
